services:
  # Corre como replica set de un solo nodo: las transacciones (spec
  # transactional-mongo) requieren un replica set. URI de conexión local:
  # mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
  mongo:
    image: mongo:8
    container_name: crypto-tracker-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate().ok }"
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP falso para desarrollo local (spec alertas-email): captura los
  # correos enviados por la app sin entregarlos de verdad. UI web en
  # http://localhost:8025 para inspeccionarlos.
  mailpit:
    image: axllent/mailpit
    container_name: crypto-tracker-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mongo_data:
